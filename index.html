<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>阿昌 · 数字分身</title>
    <meta name="description" content="阿昌的数字分身：打开网页就能直接说话，实时语音识别 + 大模型 + 语音合成。">
    <meta name="theme-color" content="#05080f">
    <meta name="color-scheme" content="dark">

    <!-- 分享卡片 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="阿昌 · 数字分身">
    <meta property="og:description" content="打开就能说话：实时语音识别、大模型回答、克隆音色回复。">
    <meta property="og:image" content="assets/avatar@512.png">

    <link rel="icon" href="favicon.ico">
    <!-- Tailwind（本地编译产物，不依赖 CDN；源样式见 css/twin.src.css） -->
    <link rel="stylesheet" href="css/twin.css?v=1">
    <script>
    var _hmt = _hmt || [];
    (function() {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?6d9430ea497e0652a42e0aa5a2fcc6c3";
      var s = document.getElementsByTagName("script")[0]; 
      s.parentNode.insertBefore(hm, s);
    })();
    </script>
</head>

<body class="min-h-dvh overflow-y-auto bg-[#05080f] font-sans text-slate-200 antialiased" data-state="offline">

    <!-- 背景极光 -->
    <div class="aurora" aria-hidden="true">
        <div class="aurora-vignette"></div>
    </div>

    <main class="relative mx-auto flex min-h-dvh w-full max-w-lg flex-col px-5 pb-5 pt-4">

        <!-- 顶栏：连接状态 + 右上角一句轮换的禅语 -->
        <header class="flex w-full items-center justify-between gap-2 px-1 text-[11px] tracking-wider text-slate-500">
            <span class="inline-flex shrink-0 items-center gap-2">
                <span class="pill-dot h-1.5 w-1.5 rounded-full"></span>
                <span id="pillText">未连接</span>
            </span>
            <span id="zen" aria-live="off"><span id="zenText">日日是好日</span></span>
        </header>

        <!-- 主体 -->
        <div class="flex flex-1 items-center justify-center py-5">
            <section class="card flex w-full max-w-sm flex-col items-center">

                <!-- 头像 + 波纹环 -->
                <div id="stage" class="orb">
                    <div class="orb-halo"></div>
                    <div class="orb-ring orb-ring-a"></div>
                    <div class="orb-ring orb-ring-b"></div>
                    <div class="orb-face">
                        <img id="avatar" src="assets/avatar.png" srcset="assets/avatar.png 1x, assets/avatar@512.png 2x"
                            alt="阿昌的头像" width="512" height="512" decoding="async">
                    </div>
                </div>

                <!-- 名字 + 状态 -->
                <div class="mt-5 text-center">
                    <h1 class="text-[1.5rem] font-semibold leading-none tracking-[0.3em] text-slate-50">阿昌</h1>
                    <p class="mt-2.5 text-[11px] tracking-[0.2em] text-slate-500">阿昌的数字分身</p>
                    <p id="status" aria-live="polite"
                        class="mt-4 min-h-[1.25rem] text-[13px] leading-5 text-slate-300">点下面的按钮，开始和我说话</p>
                </div>

                <!-- 波纹（实时音量） -->
                <canvas id="wave" class="mt-5 h-12 w-full" aria-hidden="true"></canvas>

                <!-- 最近几轮对话（固定高度，避免对话时页面跳动） -->
                <div id="transcript"
                    class="mt-4 flex h-[4.5rem] w-full flex-col justify-end gap-1.5 overflow-hidden text-[13px] leading-5">
                </div>

                <!-- 主按钮 -->
                <button id="btnMain" type="button" class="btn btn-start mt-5 w-full" aria-pressed="false">
                    <svg id="icoMic" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Zm7 9a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V20H8.5a1 1 0 0 0 0 2h7a1 1 0 0 0 0-2H13v-2.08A7 7 0 0 0 19 11Z" />
                    </svg>
                    <svg id="icoStop" class="hidden h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M7 7h10v10H7z" />
                    </svg>
                    <span id="btnLabel">开始对话</span>
                </button>

                <p id="hint" class="mt-3 text-center text-[11px] leading-4 text-slate-500">
                    需要麦克风权限 · 语音实时识别与合成
                </p>
            </section>
        </div>

        <!-- 页脚：站点署名（许可与上游归属见 NOTICE.md / LICENSE） -->
        <footer class="flex items-center justify-center gap-2.5 text-[10px] text-slate-600">
            <a id="devLinks" href="diagnostics.html" class="hidden transition-colors hover:text-slate-400">部署自检</a>
            <span id="devSep" class="hidden" aria-hidden="true">·</span>
            <a id="devStandalone" href="standalone/" class="hidden transition-colors hover:text-slate-400">单文件版</a>
            <span id="devSep2" class="hidden" aria-hidden="true">·</span>
            <span>&copy; 2026 wuchang.me</span>
            <span aria-hidden="true">·</span>
            <span>阿昌的数字分身</span>
        </footer>
    </main>

    <noscript>
        <p class="fixed inset-x-0 bottom-0 bg-slate-900 p-3 text-center text-xs text-slate-300">
            这个页面需要 JavaScript 才能使用麦克风。
        </p>
    </noscript>

    <!-- Opus 编解码（小智协议上行/下行都是 Opus） -->
    <script src="js/utils/libopus.js?v=1"></script>
    <!-- 一句禅语（纯展示，不参与语音链路） -->
    <script src="js/zen.js?v=1"></script>
    <!-- 主逻辑 -->
    <script src="js/twin.js?v=1"></script>
</body>

</html>
