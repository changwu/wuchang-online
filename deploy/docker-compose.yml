# docker-compose 部署示例
#
# 两种用法：
#   1. 只起静态服务，由宿主机上已有的反向代理（Caddy/Nginx）转发进来
#   2. 连反向代理一起用，见 deploy/Caddyfile.example
#
# 启动：docker compose up -d

services:
  wuchang-online:
    image: caddy:2-alpine
    container_name: wuchang-online
    restart: unless-stopped
    # 挂载到容器里只读，改文件不用重建镜像
    volumes:
      - ../:/srv:ro
    command: caddy file-server --root /srv --listen :80
    # 只监听本机，由宿主机反代转发；要直接对外就改成 "8000:80"
    ports:
      - "127.0.0.1:8000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/", ">", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
